<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects Hub</title>
<meta name="description" content="Projects by cadensauce.">
<style>
  :root { --bg:#fafafa; --card:#fff; --text:#111; --muted:#666; --line:#e5e5e5; --hover:#d4d4d4; --live:#16a34a; --dev:#d97706; --off:#9ca3af; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b0b0c; --card:#151517; --text:#f2f2f2; --muted:#9a9a9a; --line:#26262a; --hover:#3a3a40; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:880px; margin:0 auto; padding:64px 16px 48px; }
  h1 { font-size:28px; letter-spacing:-.02em; margin:0 0 6px; }
  .sub { color:var(--muted); margin:0 0 36px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; }
  .card { display:flex; flex-direction:column; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; color:inherit; text-decoration:none; transition:border-color .15s, transform .15s; }
  a.card:hover { border-color:var(--hover); transform:translateY(-2px); }
  .top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  h2 { font-size:17px; margin:0; }
  .status { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); white-space:nowrap; }
  .status::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--off); }
  .status.live::before { background:var(--live); } .status.dev::before { background:var(--dev); }
  p { margin:0; color:var(--muted); font-size:14px; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:auto; }
  .tag { font-size:12px; border:1px solid var(--line); border-radius:999px; padding:2px 9px; color:var(--muted); }
  .upd { font-size:12px; color:var(--muted); }
  .go { font-size:13px; margin-top:auto; } .tags + .go { margin-top:0; }
  footer { margin-top:48px; color:var(--muted); font-size:13px; }
  footer a { color:inherit; }
</style>
</head>
<body>
<main>
  <h1>Projects Hub</h1>
  <p class="sub">Things I build and keep running.</p>
  <div class="grid" id="grid"></div>
  <footer><a href="https://github.com/cadensauce">github.com/cadensauce</a></footer>
</main>
<script src="projects.js"></script>
<script>
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const cls = s => /live/i.test(s) ? "live" : /dev|progress|beta/i.test(s) ? "dev" : "";
  document.getElementById("grid").innerHTML = PROJECTS.map((p, i) => {
    const tag = p.url ? "a" : "div";
    const href = p.url ? ` href="${esc(p.url)}"` : "";
    const host = p.url ? new URL(p.url).host + new URL(p.url).pathname.replace(/\/$/, "") : "";
    return `<${tag} class="card"${href}>
      <div class="top"><h2>${esc(p.name)}</h2><span class="status ${cls(p.status)}">${esc(p.status)}</span></div>
      <p>${esc(p.desc)}</p>
      ${p.notes ? `<div class="tags">${p.notes.map(n => `<span class="tag">${esc(n)}</span>`).join("")}</div>` : ""}
      <span class="upd" data-i="${i}"></span>
      ${p.url ? `<span class="go">${esc(host)} →</span>` : ""}
    </${tag}>`;
  }).join("");
  const ago = d => { const s = (Date.now() - d) / 1000, u = [["year",31536e3],["month",2592e3],["week",604800],["day",86400],["hour",3600],["minute",60]];
    for (const [n, v] of u) if (s >= v) { const k = Math.floor(s / v); return `${k} ${n}${k > 1 ? "s" : ""} ago`; } return "just now"; };
  const show = (i, d) => { const el = document.querySelector(`.upd[data-i="${i}"]`); if (!el || isNaN(d)) return;
    el.textContent = "Updated " + ago(d); el.title = d.toLocaleString(); };
  PROJECTS.forEach((p, i) => {
    if (p.repo) fetch(`https://api.github.com/repos/${p.repo}`).then(r => r.ok ? r.json() : null)
      .then(j => j && show(i, new Date(j.pushed_at))).catch(() => {});
    else if (p.updated) show(i, new Date(p.updated));
  });
</script>
</body>
</html>
